name: FortiWeb diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect-fortiweb:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect FortiWeb live HTML
        shell: cmd
        run: |
          echo ==== PRODUCT ROOT ====
          curl.exe -L --fail --silent --show-error -w "FINAL_URL=%%{url_effective} HTTP=%%{http_code}
" https://docs.fortinet.com/product/fortiweb -o fortiweb-root.html
          findstr /i /n /c:"/document/" fortiweb-root.html > fortiweb-root-document-lines.txt
          for %%F in (fortiweb-root-document-lines.txt) do echo DOCUMENT_MATCH_BYTES=%%~zF
          type fortiweb-root-document-lines.txt

          echo ==== 8.0.1 ====
          curl.exe -L --fail --silent --show-error -w "FINAL_URL=%%{url_effective} HTTP=%%{http_code}
" https://docs.fortinet.com/product/fortiweb/8.0.1 -o fortiweb-801.html
          findstr /i /n /c:"/document/" fortiweb-801.html > fortiweb-801-document-lines.txt
          for %%F in (fortiweb-801-document-lines.txt) do echo DOCUMENT_MATCH_BYTES=%%~zF
          type fortiweb-801-document-lines.txt

          echo ==== 7.6.6 ====
          curl.exe -L --fail --silent --show-error -w "FINAL_URL=%%{url_effective} HTTP=%%{http_code}
" https://docs.fortinet.com/product/fortiweb/7.6.6 -o fortiweb-766.html
          findstr /i /n /c:"/document/" fortiweb-766.html > fortiweb-766-document-lines.txt
          for %%F in (fortiweb-766-document-lines.txt) do echo DOCUMENT_MATCH_BYTES=%%~zF
          type fortiweb-766-document-lines.txt
