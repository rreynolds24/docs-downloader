name: Source structure probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Fortinet docs and Community source structures
        shell: cmd
        run: |
          mkdir probe
          curl.exe -L --fail --silent --show-error https://docs.fortinet.com/solution-hubs -o probe\solution-hubs.html
          curl.exe -L --fail --silent --show-error https://docs.fortinet.com/sdwan/8.0 -o probe\sdwan.html
          curl.exe -L --fail --silent --show-error https://community.fortinet.com/knowledge-base -o probe\kb.html
          curl.exe -L --fail --silent --show-error https://community.fortinet.com/fortigate-3 -o probe\fortigate.html
          curl.exe -L --fail --silent --show-error "https://community.fortinet.com/fortigate-3?page=2" -o probe\fortigate-page2.html
          curl.exe -L --fail --silent --show-error https://community.fortinet.com/sitemap.xml -o probe\sitemap.xml
          curl.exe -L --fail --silent --show-error https://community.fortinet.com/sitemap-topics-1.xml -o probe\topics1.xml
          curl.exe -L --fail --silent --show-error https://community.fortinet.com/sitemap-topics-2.xml -o probe\topics2.xml

          echo ===== solution-hubs interesting lines =====
          findstr /i /c:"/document/" /c:"/sdwan/" /c:"solution-hub" /c:"solution-hubs" probe\solution-hubs.html

          echo ===== sdwan interesting lines =====
          findstr /i /c:"/document/" /c:"reader-pdf" /c:"href=" /c:"solution" probe\sdwan.html

          echo ===== KB interesting lines =====
          findstr /i /c:"knowledge-base" /c:"api" /c:"article" /c:"fortigate-3" probe\kb.html

          echo ===== FortiGate category interesting lines =====
          findstr /i /c:"technical-tip" /c:"article" /c:"api" /c:"pagination" /c:"page=" /c:"fortigate-3/" probe\fortigate.html

          echo ===== sitemap =====
          type probe\sitemap.xml

          echo ===== python structural summary =====
          python -c "import re,pathlib; s=pathlib.Path(r'probe\sdwan.html').read_text(encoding='utf-8',errors='ignore'); h=re.findall(r'href=[\"\x27]([^\"\x27]+)',s,re.I); d=list(dict.fromkeys([x for x in h if '/document/' in x])); p=list(dict.fromkeys([x for x in h if '.pdf' in x.lower()])); print('SDWAN_DOC_LINKS',len(d)); print(*d[:40],sep='\n'); print('SDWAN_PDF_LINKS',len(p)); print(*p[:20],sep='\n')"
          python -c "import re,pathlib; s=pathlib.Path(r'probe\solution-hubs.html').read_text(encoding='utf-8',errors='ignore'); h=re.findall(r'href=[\"\x27]([^\"\x27]+)',s,re.I); x=list(dict.fromkeys([v for v in h if v.startswith('/') and v not in ['/solution-hubs']])); print('HUB_LINKS',len(x)); print(*[v for v in x if not v.startswith('/product/')][:80],sep='\n')"
          python -c "import re,pathlib; s=pathlib.Path(r'probe\fortigate.html').read_text(encoding='utf-8',errors='ignore'); h=re.findall(r'href=[\"\x27]([^\"\x27]+)',s,re.I); a=list(dict.fromkeys([x for x in h if 'community.fortinet.com/fortigate-3/' in x and re.search(r'-\d+$',x)])); print('FORTIGATE_PAGE1_ARTICLES',len(a)); print(*a[:30],sep='\n')"
          python -c "import re,pathlib; s=pathlib.Path(r'probe\fortigate-page2.html').read_text(encoding='utf-8',errors='ignore'); h=re.findall(r'href=[\"\x27]([^\"\x27]+)',s,re.I); a=list(dict.fromkeys([x for x in h if 'community.fortinet.com/fortigate-3/' in x and re.search(r'-\d+$',x)])); print('FORTIGATE_PAGE2_ARTICLES',len(a)); print(*a[:30],sep='\n')"
          python -c "import re,pathlib; s=''.join(pathlib.Path(r'probe\\'+n).read_text(encoding='utf-8',errors='ignore') for n in ['topics1.xml','topics2.xml']); u=re.findall(r'<loc>([^<]+)</loc>',s,re.I); a=[x for x in u if '/fortigate-3/' in x]; print('FORTIGATE_SITEMAP_ARTICLES',len(a)); print(*a[:20],sep='\n')"

          echo ===== file sizes =====
          for %%F in (probe\*) do echo %%~nxF %%~zF
