name: Windows validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GitHub ZIP extraction acceptance
        shell: cmd
        run: |
          set "ARCHIVE_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
          curl.exe -L --fail --silent --show-error "https://github.com/${{ github.repository }}/archive/%ARCHIVE_SHA%.zip" -o github-archive.zip
          if errorlevel 1 exit /b 80
          mkdir github-archive
          tar.exe -xf github-archive.zip -C github-archive
          if errorlevel 1 exit /b 81
          set "ZIP_ROOT="
          for /d %%D in (github-archive\*) do if not defined ZIP_ROOT set "ZIP_ROOT=%%~fD"
          if not defined ZIP_ROOT exit /b 82
          pushd "%ZIP_ROOT%"
          call install.bat
          if errorlevel 1 exit /b %errorlevel%
          call run.bat hubs > zip-hubs.txt
          set RC=%ERRORLEVEL%
          type zip-hubs.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /i /c:"https://docs.fortinet.com/sdwan" zip-hubs.txt >nul
          if errorlevel 1 exit /b 83
          call run.bat inventory https://docs.fortinet.com/sdwan/8.0 > zip-sdwan.txt
          set RC=%ERRORLEVEL%
          type zip-sdwan.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Resources discovered" zip-sdwan.txt >nul
          if errorlevel 1 exit /b 84
          popd

      - name: Install and doctor
        shell: cmd
        run: |
          call install.bat
          if errorlevel 1 exit /b %errorlevel%
          call run.bat doctor
          if errorlevel 1 exit /b %errorlevel%

      - name: Installer detects incomplete Solution Hub module
        shell: cmd
        run: |
          copy /y solution-downloader.bat solution-downloader.good >nul
          > solution-downloader.bat echo @echo off
          >> solution-downloader.bat echo :doctor
          >> solution-downloader.bat echo exit /b 0
          call install.bat > integrity-fail.txt
          set RC=%ERRORLEVEL%
          type integrity-fail.txt
          if "%RC%"=="0" exit /b 70
          findstr /c:"missing :hubs label" integrity-fail.txt >nul
          if errorlevel 1 exit /b 71
          move /y solution-downloader.good solution-downloader.bat >nul
          call install.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Parser self-test
        shell: cmd
        run: |
          call run.bat selftest
          if errorlevel 1 exit /b %errorlevel%

      - name: Live FortiPAM 7.0 inventory
        shell: cmd
        run: |
          call run.bat inventory https://docs.fortinet.com/product/fortipam/7.0
          if errorlevel 1 exit /b %errorlevel%

      - name: Live FortiPAM 7.0 first versioned download
        shell: cmd
        run: |
          call run.bat download https://docs.fortinet.com/product/fortipam/7.0 > first-versioned.txt
          set RC=%ERRORLEVEL%
          type first-versioned.txt
          if not "%RC%"=="0" exit /b %RC%
          set PDF_COUNT=0
          for /r runtime\downloads %%F in (*.pdf) do (
            if %%~zF LEQ 0 exit /b 20
            set /a PDF_COUNT+=1
          )
          if not "%PDF_COUNT%"=="6" exit /b 21
          if not exist runtime\downloads\products\fortipam\7.0 exit /b 97
          set ROOT_PDF_COUNT=0
          for %%F in (runtime\downloads\*.pdf) do set /a ROOT_PDF_COUNT+=1
          if not "%ROOT_PDF_COUNT%"=="0" exit /b 98
          findstr /c:"Downloaded/updated     : 6" first-versioned.txt >nul
          if errorlevel 1 exit /b 22
          findstr /c:"Duplicate content     : 0" first-versioned.txt >nul
          if errorlevel 1 exit /b 23
          if not exist runtime\state\downloads.db exit /b 24
          if not exist runtime\state\catalogue.db exit /b 25
          findstr /c:"https://docs.fortinet.com/document/fortipam/" runtime\state\downloads.db >nul
          if errorlevel 1 exit /b 26
          findstr /c:"|fortipam|" runtime\state\catalogue.db >nul
          if errorlevel 1 exit /b 27
          findstr /c:"|CURRENT|" runtime\state\catalogue.db >nul
          if errorlevel 1 exit /b 28

      - name: Live FortiPAM 7.0 read-only version check
        shell: cmd
        run: |
          call run.bat check https://docs.fortinet.com/product/fortipam/7.0 > version-check.txt
          set RC=%ERRORLEVEL%
          type version-check.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"New versions          : 0" version-check.txt >nul
          if errorlevel 1 exit /b 26
          findstr /c:"Updated in place      : 0" version-check.txt >nul
          if errorlevel 1 exit /b 27
          findstr /c:"Unchanged PDFs        : 6" version-check.txt >nul
          if errorlevel 1 exit /b 28

      - name: Live FortiPAM 7.0 second download skips unchanged PDFs
        shell: cmd
        run: |
          call run.bat download https://docs.fortinet.com/product/fortipam/7.0 > tracking-second.txt
          set RC=%ERRORLEVEL%
          type tracking-second.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Downloaded/updated     : 0" tracking-second.txt >nul
          if errorlevel 1 exit /b 29
          findstr /c:"Unchanged/skipped     : 6" tracking-second.txt >nul
          if errorlevel 1 exit /b 30
          findstr /c:"Unchanged PDFs        : 6" tracking-second.txt >nul
          if errorlevel 1 exit /b 31

      - name: Live FortiCamera root inventory
        shell: cmd
        run: |
          call run.bat inventory https://docs.fortinet.com/product/forticamera
          if errorlevel 1 exit /b %errorlevel%

      - name: Live FortiWeb root inventory
        shell: cmd
        run: |
          call run.bat inventory https://docs.fortinet.com/product/fortiweb/
          if errorlevel 1 exit /b %errorlevel%

      - name: Ordering guide parser fixture
        shell: cmd
        run: |
          > ordering-fixture.html echo ^<a href="https://www.fortinet.com/content/dam/fortinet/assets/datasheets/og-example.pdf"^>Guide^</a^>
          >> ordering-fixture.html echo ^<a href="/document/fortipam/7.0/administration-guide"^>Document^</a^>
          >> ordering-fixture.html echo ^<a href="https://evil.example/og-malicious.pdf"^>Ignore^</a^>
          cscript.exe //nologo scripts\\fortinet-parser.js ordering-guides ordering-fixture.html ordering-fixture.txt
          if errorlevel 1 exit /b 86
          findstr /c:"og-example.pdf" ordering-fixture.txt >nul
          if errorlevel 1 exit /b 87
          findstr /c:"administration-guide" ordering-fixture.txt >nul
          if errorlevel 1 exit /b 88
          findstr /c:"evil.example" ordering-fixture.txt >nul
          if not errorlevel 1 exit /b 89
          exit /b 0

      - name: Live ordering guides inventory
        shell: cmd
        run: |
          call run.bat ordering-guides inventory > ordering-inventory.txt
          set RC=%ERRORLEVEL%
          type ordering-inventory.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Resources discovered" ordering-inventory.txt >nul
          if errorlevel 1 exit /b 90
          findstr /c:"PDF targets resolved   : 0" ordering-inventory.txt >nul
          if not errorlevel 1 exit /b 91

      - name: Live Solution Hub index discovery
        shell: cmd
        run: |
          call run.bat hubs > hubs.txt
          set RC=%ERRORLEVEL%
          type hubs.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /i /c:"https://docs.fortinet.com/sdwan" hubs.txt >nul
          if errorlevel 1 exit /b 39

      - name: Live Solution Hub SD-WAN inventory
        shell: cmd
        run: |
          call run.bat inventory https://docs.fortinet.com/sdwan/8.0 > solution-inventory.txt
          set RC=%ERRORLEVEL%
          type solution-inventory.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Resources discovered" solution-inventory.txt >nul
          if errorlevel 1 exit /b 40
          findstr /c:"PDF targets resolved   : 0" solution-inventory.txt >nul
          if not errorlevel 1 exit /b 41
          if not exist runtime\state\sources.db exit /b 42
          findstr /c:"https://docs.fortinet.com/sdwan/8.0" runtime\state\sources.db >nul
          if errorlevel 1 exit /b 43

      - name: Live Solution Hub download de-duplicates curated references
        shell: cmd
        run: |
          call run.bat download https://docs.fortinet.com/sdwan/8.0 > solution-download.txt
          set RC=%ERRORLEVEL%
          type solution-download.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Downloaded             : 0" solution-download.txt >nul
          if not errorlevel 1 exit /b 60
          findstr /c:"Duplicate downloads avoided: 0" solution-download.txt >nul
          if not errorlevel 1 exit /b 61

          call run.bat download https://docs.fortinet.com/sdwan/8.0 > solution-second.txt
          set RC=%ERRORLEVEL%
          type solution-second.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Downloaded             : 0" solution-second.txt >nul
          if errorlevel 1 exit /b 62

      - name: Live Knowledge Base category discovery
        shell: cmd
        run: |
          call run.bat kb categories > kb-categories.txt
          set RC=%ERRORLEVEL%
          type kb-categories.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /i /c:"FortiGate" kb-categories.txt >nul
          if errorlevel 1 exit /b 44
          findstr /i /c:"https://community.fortinet.com/fortigate-3" kb-categories.txt >nul
          if errorlevel 1 exit /b 45

      - name: Live Knowledge Base bounded sync and repeat check
        shell: cmd
        run: |
          call run.bat kb sync https://community.fortinet.com/fortigate-3 2 > kb-sync.txt
          set RC=%ERRORLEVEL%
          type kb-sync.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Articles discovered     : 2" kb-sync.txt >nul
          if errorlevel 1 exit /b 46
          findstr /c:"Downloaded/updated      : 2" kb-sync.txt >nul
          if errorlevel 1 exit /b 47
          if not exist runtime\state\kb.db exit /b 48
          if not exist runtime\kb\articles\fortigate-3\article-1.html exit /b 49

          call run.bat kb check https://community.fortinet.com/fortigate-3 2 > kb-check.txt
          set RC=%ERRORLEVEL%
          type kb-check.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"Articles discovered     : 2" kb-check.txt >nul
          if errorlevel 1 exit /b 50
          findstr /c:"Unchanged articles      : 2" kb-check.txt >nul
          if errorlevel 1 exit /b 51

      - name: Legacy v0.0.9 overlay can bootstrap refreshed Solution Hub module
        shell: cmd
        run: |
          mkdir legacy-install
          mkdir legacy-install\runtime
          mkdir legacy-install\runtime\temp
          mkdir legacy-install\runtime\temp\update
          mkdir legacy-install\runtime\temp\update\extract
          mkdir legacy-install\runtime\temp\update\extract\docs-downloader-main
          > legacy-install\solution-downloader.bat echo @echo off
          >> legacy-install\solution-downloader.bat echo :doctor
          >> legacy-install\solution-downloader.bat echo exit /b 0
          > legacy-install\VERSION echo 0.0.9
          copy /y solution-downloader.bat legacy-install\runtime\temp\update\extract\docs-downloader-main\solution-downloader.bat >nul
          copy /y VERSION legacy-install\runtime\temp\update\extract\docs-downloader-main\VERSION >nul
          robocopy.exe legacy-install\runtime\temp\update\extract\docs-downloader-main legacy-install /E /R:2 /W:1 /XD runtime .git /NFL /NDL /NJH /NJS /NP >nul
          set RC=%ERRORLEVEL%
          if %RC% GEQ 8 exit /b 72
          findstr /x /c:":hubs" legacy-install\solution-downloader.bat >nul
          if errorlevel 1 exit /b 73
          findstr /x /c:":lookup_duplicate_remote" legacy-install\solution-downloader.bat >nul
          if errorlevel 1 exit /b 74

      - name: Native self-update hash-verifies same-version files and preserves runtime state
        shell: cmd
        run: |
          mkdir update-fixture
          mkdir update-fixture\docs-downloader-main
          mkdir update-fixture\docs-downloader-main\scripts
          copy /y run.bat update-fixture\docs-downloader-main\run.bat >nul
          copy /y docs-downloader.bat update-fixture\docs-downloader-main\docs-downloader.bat >nul
          copy /y solution-downloader.bat update-fixture\docs-downloader-main\solution-downloader.bat >nul
          copy /y kb-downloader.bat update-fixture\docs-downloader-main\kb-downloader.bat >nul
          copy /y update.bat update-fixture\docs-downloader-main\update.bat >nul
          copy /y install.bat update-fixture\docs-downloader-main\install.bat >nul
          copy /y VERSION update-fixture\docs-downloader-main\VERSION >nul
          copy /y scripts\fortinet-parser.js update-fixture\docs-downloader-main\scripts\fortinet-parser.js >nul
          copy /y scripts\corpus-layout.js update-fixture\docs-downloader-main\scripts\corpus-layout.js >nul
          tar.exe -a -cf update-fixture.zip -C update-fixture docs-downloader-main
          if errorlevel 1 exit /b 75
          > runtime\preserve-me.txt echo persistent-state
          > runtime\downloads\legacy-upgrade.pdf echo legacy-pdf-bytes
          >> runtime\state\downloads.db echo https://docs.fortinet.com/document/fortipam/7.0/legacy^|https://example/legacy.pdf^|legacy-upgrade.pdf^|-^|legacy-upgrade.pdf
          >> runtime\state\catalogue.db echo https://docs.fortinet.com/document/fortipam/7.0/legacy^|fortipam^|legacy^|7.0^|7.0^|https://example/legacy.pdf^|legacy-upgrade.pdf^|-^|-^|deadbeef^|first^|last^|legacy-upgrade.pdf^|CURRENT^|https://docs.fortinet.com/product/fortipam/7.0
          >> runtime\state\sources.db echo https://docs.fortinet.com/sdwan/8.0^|https://docs.fortinet.com/document/fortipam/7.0/legacy^|https://example/legacy.pdf^|deadbeef^|first^|last^|legacy-upgrade.pdf
          > solution-downloader.bat echo @echo off
          >> solution-downloader.bat echo :doctor
          >> solution-downloader.bat echo exit /b 0
          set "DOCS_DOWNLOADER_UPDATE_URL=file:///%CD:\=/%/update-fixture.zip"
          call run.bat update
          if errorlevel 1 exit /b %errorlevel%
          findstr /x /c:"0.0.15" VERSION >nul
          if errorlevel 1 exit /b 76
          findstr /x /c:":hubs" solution-downloader.bat >nul
          if errorlevel 1 exit /b 77
          findstr /x /c:":lookup_duplicate_remote" solution-downloader.bat >nul
          if errorlevel 1 exit /b 78
          findstr /x /c:"persistent-state" runtime\preserve-me.txt >nul
          if errorlevel 1 exit /b 79
          call run.bat doctor > post-update-doctor.txt
          set RC=%ERRORLEVEL%
          type post-update-doctor.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"v0.0.15" post-update-doctor.txt >nul
          if errorlevel 1 exit /b 85
