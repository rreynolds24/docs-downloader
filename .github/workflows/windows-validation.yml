name: Windows validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and doctor
        shell: cmd
        run: |
          call install.bat
          if errorlevel 1 exit /b %errorlevel%
          call run.bat doctor
          if errorlevel 1 exit /b %errorlevel%

      - name: Parser self-test
        shell: cmd
        run: |
          call run.bat selftest
          if errorlevel 1 exit /b %errorlevel%

      - name: Live FortiPAM 7.0 inventory
        shell: cmd
        run: |
          call run.bat inventory https://docs.fortinet.com/product/fortipam/7.0
          if errorlevel 1 exit /b %errorlevel%

      - name: Live FortiPAM 7.0 download
        shell: cmd
        run: |
          call run.bat download https://docs.fortinet.com/product/fortipam/7.0
          if errorlevel 1 exit /b %errorlevel%
          for %%F in (runtime\downloads\*.pdf) do if %%~zF LEQ 0 exit /b 20
          dir /b runtime\downloads\*.pdf

      - name: Diagnostic FortiWeb markup
        shell: cmd
        run: |
          curl.exe -L --fail --silent --show-error https://docs.fortinet.com/product/fortiweb -o fortiweb-root.html
          echo ==== ROOT document lines ====
          findstr /i /n /c:"/document/" fortiweb-root.html
          echo ROOT_FINDSTR_RC=%ERRORLEVEL%

          curl.exe -L --fail --silent --show-error https://docs.fortinet.com/product/fortiweb/8.0.1 -o fortiweb-801.html
          echo ==== 8.0.1 document lines ====
          findstr /i /n /c:"/document/" fortiweb-801.html
          echo FWB801_FINDSTR_RC=%ERRORLEVEL%

          curl.exe -L --fail --silent --show-error https://docs.fortinet.com/product/fortiweb/7.6.6 -o fortiweb-766.html
          echo ==== 7.6.6 document lines ====
          findstr /i /n /c:"/document/" fortiweb-766.html
          echo FWB766_FINDSTR_RC=%ERRORLEVEL%
          exit /b 0

      - name: Diagnostic FortiWeb version-family URLs
        shell: cmd
        run: |
          for %%V in (8.0 7.6 7.4) do (
            echo ==== FortiWeb %%V ====
            curl.exe -L --fail --silent --show-error https://docs.fortinet.com/product/fortiweb/%%V -o fortiweb-%%V.html
            echo CURL_RC=!ERRORLEVEL!
            if exist fortiweb-%%V.html (
              findstr /i /n /c:"/document/" fortiweb-%%V.html > fortiweb-%%V-matches.txt
              for %%F in (fortiweb-%%V-matches.txt) do echo MATCH_BYTES=%%~zF
            )
          )
          exit /b 0
